<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Writer</title>
<meta name="description" content="A local-first notes app for writing books: chapters, scenes, goals, characters and outlines.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121118" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try {
    var d = JSON.parse(localStorage.getItem('bookwriter:data:v1'));
    var t = d && d.settings && d.settings.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="btnBinder" aria-label="Toggle chapter list" title="Chapters">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <button class="project-btn" id="btnProjects" title="Switch or manage books">
      <span class="project-name" id="projectName">Book</span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="view-tabs" role="tablist" aria-label="View">
      <button role="tab" data-view="write">Write</button>
      <button role="tab" data-view="plan">Plan</button>
    </div>
    <div class="spacer"></div>
    <span class="save-status" id="saveStatus" aria-live="polite"></span>
    <button class="icon-btn" id="btnNotes" aria-label="Characters and locations" title="Characters &amp; locations">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
    </button>
    <button class="icon-btn" id="btnFocus" aria-label="Focus mode" title="Focus mode (Ctrl+Shift+F)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <button class="icon-btn" id="btnTheme" aria-label="Change theme" title="Theme"></button>
    <button class="icon-btn" id="btnMenu" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" title="Export, import, settings">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </header>

  <div class="workspace">
    <aside class="binder" id="binder" aria-label="Chapters and scenes">
      <div class="panel-head">
        <div>
          <h2>Manuscript</h2>
          <small id="binderTotal"></small>
        </div>
        <button class="btn sm" id="btnAddChapter">+ Chapter</button>
      </div>
      <div class="binder-scroll" id="binderScroll">
        <div id="binderList" data-sort-root data-sort-container="chapter"></div>
      </div>
    </aside>

    <main class="main">
      <section id="writeView" class="write-view">
        <div class="write-empty" id="writeEmpty" hidden>
          <p>This book has no scenes yet.</p>
          <button class="btn primary" id="btnEmptyAdd">Add a chapter</button>
        </div>
        <div class="editor-wrap" id="editorWrap">
          <div class="editor-head">
            <button class="crumb" id="crumbChapter" title="Chapter options"></button>
            <span class="crumb-sep" aria-hidden="true">/</span>
            <input id="sceneTitle" class="scene-title" placeholder="Scene title" aria-label="Scene title" autocomplete="off">
            <select id="sceneStatus" class="status-select" aria-label="Scene status"></select>
            <div class="head-actions">
              <button class="icon-btn sm" id="btnPrev" aria-label="Previous scene" title="Previous scene">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <button class="icon-btn sm" id="btnNext" aria-label="Next scene" title="Next scene">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              </button>
              <button class="icon-btn sm" id="btnDeleteScene" aria-label="Delete scene" title="Delete scene">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
              </button>
            </div>
          </div>
          <textarea id="editor" class="editor" spellcheck="true" placeholder="Start writing…" aria-label="Scene text"></textarea>
        </div>
        <footer class="statusbar" id="statusbar">
          <div class="counts">
            <span><b id="wcScene">0</b> scene</span>
            <span><b id="wcChapter">0</b> chapter</span>
            <span><b id="wcBook">0</b> book</span>
          </div>
          <div class="goals">
            <div class="goal" id="goalSession" title="Net words written this session">
              <span class="goal-label">Session</span>
              <div class="meter"><i></i></div>
              <span class="goal-val"></span>
            </div>
            <div class="goal" id="goalDaily" title="Net words written today">
              <span class="goal-label">Today</span>
              <div class="meter"><i></i></div>
              <span class="goal-val"></span>
            </div>
            <button class="icon-btn sm" id="btnGoals" aria-label="Goals and editor settings" title="Goals &amp; editor settings">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
            </button>
            <button class="btn sm exit-focus" id="btnExitFocus">Exit focus</button>
          </div>
        </footer>
      </section>

      <section id="planView" class="plan-view" hidden>
        <div class="plan-scroll" id="planScroll"></div>
      </section>
    </main>

    <aside class="notes" id="notes" aria-label="Characters and locations">
      <div class="panel-head">
        <div class="seg" role="tablist" aria-label="Note type">
          <button role="tab" data-tab="characters">Characters <span class="pill" id="countChars">0</span></button>
          <button role="tab" data-tab="locations">Locations <span class="pill" id="countLocs">0</span></button>
        </div>
        <button class="icon-btn sm" id="btnCloseNotes" aria-label="Close notes panel" title="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="notes-tools">
        <input type="search" id="notesSearch" class="input" placeholder="Search…" aria-label="Search notes">
        <button class="btn sm primary" id="btnAddNote">+ New</button>
      </div>
      <div class="notes-scroll" id="notesList"></div>
    </aside>

    <div class="scrim" id="scrim"></div>
  </div>
</div>

<div class="menu" id="menu" role="menu" hidden>
  <button role="menuitem" data-cmd="projects">Your books…</button>
  <button role="menuitem" data-cmd="goals">Goals &amp; editor settings…</button>
  <hr>
  <button role="menuitem" data-cmd="export-md">Export manuscript (.md)</button>
  <button role="menuitem" data-cmd="export-txt">Export manuscript (.txt)</button>
  <hr>
  <button role="menuitem" data-cmd="export-json">Back up all data (.json)</button>
  <button role="menuitem" data-cmd="import-json">Import backup (.json)…</button>
  <hr>
  <button role="menuitem" data-cmd="shortcuts">Keyboard shortcuts</button>
</div>

<div id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="js/app.js"></script>
</body>
</html>
